<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#f5ede4"/>
    </radialGradient>
    <linearGradient id="bun4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="choc4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350f" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg4)"/>
  <circle cx="300" cy="300" r="210" fill="#fff" opacity="0.6"/>
  <g filter="url(#shadow4)">
    <!-- Elongated banana roll shape -->
    <path d="M180 250 C 230 200 370 200 420 250 C 445 280 435 330 395 345 C 330 370 240 365 195 330 C 165 305 160 270 180 250 Z" fill="url(#bun4)"/>
    <ellipse cx="300" cy="250" rx="90" ry="25" fill="#fef3c7" opacity="0.45"/>
    <!-- Chocolate zig-zag drizzle -->
    <path d="M210 260 Q 240 280 270 255 T 330 260 T 390 270" stroke="url(#choc4)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M225 295 Q 260 315 295 290 T 365 300" stroke="url(#choc4)" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>
  <text x="300" y="475" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="700" fill="#78350f">Roti Pisang Cokelat</text>
  <text x="300" y="510" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#b45309" letter-spacing="3">SWEET &amp; FLAVORFUL</text>
</svg>

