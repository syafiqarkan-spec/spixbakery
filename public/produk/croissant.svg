<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#f5ede4"/>
    </radialGradient>
    <linearGradient id="crust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350f" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="300" r="210" fill="#fff" opacity="0.6"/>
  <g filter="url(#shadow)">
    <!-- Main croissant body -->
    <path d="M150 340 C 130 290 190 220 250 200 C 300 185 360 195 410 230 C 460 265 475 320 445 350 C 420 375 370 360 330 335 C 290 310 250 310 210 335 C 180 355 160 360 150 340 Z" fill="url(#crust)"/>
    <!-- Center layered fold -->
    <path d="M230 205 C 275 190 335 195 375 220 C 350 260 330 310 300 325 C 275 315 250 265 230 205 Z" fill="#b45309" opacity="0.9"/>
    <!-- Fold lines -->
    <path d="M260 200 C 290 250 280 295 285 315" stroke="#78350f" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M335 210 C 330 255 315 295 305 325" stroke="#78350f" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>
    <!-- Highlight shine -->
    <path d="M250 215 C 290 205 340 210 370 230 C 350 250 310 240 270 235 Z" fill="url(#highlight)"/>
    <!-- Tips -->
    <path d="M150 340 C 140 330 145 305 165 300 C 175 320 165 345 150 340 Z" fill="#78350f" opacity="0.8"/>
    <path d="M445 350 C 455 340 450 315 430 310 C 420 330 430 355 445 350 Z" fill="#78350f" opacity="0.8"/>
  </g>
  <text x="300" y="475" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="700" fill="#78350f">Croissant Original</text>
  <text x="300" y="510" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#b45309" letter-spacing="3">BUTTERY &amp; CRISPY</text>
</svg>

