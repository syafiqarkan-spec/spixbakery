<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#f5ede4"/>
    </radialGradient>
    <linearGradient id="bun3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350f" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg3)"/>
  <circle cx="300" cy="300" r="210" fill="#fff" opacity="0.6"/>
  <g filter="url(#shadow3)">
    <!-- Round golden cheese bread -->
    <ellipse cx="300" cy="290" rx="135" ry="105" fill="url(#bun3)"/>
    <ellipse cx="300" cy="260" rx="90" ry="40" fill="#fef3c7" opacity="0.4"/>
    <!-- Grated cheese shreds -->
    <path d="M220 250 L255 245 M270 235 L305 240 M325 245 L360 238 M230 270 L265 275 M280 265 L315 260 M330 270 L370 268 M240 290 L275 295 M295 285 L330 290 M345 295 L375 288" stroke="#fef08a" stroke-width="6" stroke-linecap="round"/>
    <path d="M250 240 L285 248 M300 250 L340 245 M260 280 L295 275 M310 278 L350 285" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>
  <text x="300" y="475" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="700" fill="#78350f">Roti Keju</text>
  <text x="300" y="510" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#b45309" letter-spacing="3">SAVORY &amp; CREAMY</text>
</svg>

