<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#f5ede4"/>
    </radialGradient>
    <linearGradient id="dough" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="glaze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#582a12"/>
      <stop offset="60%" stop-color="#3d1d0c"/>
      <stop offset="100%" stop-color="#2c1e16"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350f" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg5)"/>
  <circle cx="300" cy="300" r="210" fill="#fff" opacity="0.6"/>
  <g filter="url(#shadow5)">
    <!-- Outer donut ring -->
    <path fill-rule="evenodd" d="M300 160 C 375 160 435 220 435 295 C 435 370 375 430 300 430 C 225 430 165 370 165 295 C 165 220 225 160 300 160 Z M300 245 C 272 245 250 267 250 295 C 250 323 272 345 300 345 C 328 345 350 323 350 295 C 350 267 328 245 300 245 Z" fill="url(#dough)"/>
    <!-- Chocolate glaze layer with drippy curves -->
    <path fill-rule="evenodd" d="M300 165 C 365 165 425 210 425 285 C 425 310 415 325 405 345 C 395 365 385 360 370 375 C 350 395 340 420 315 420 C 290 420 280 405 260 410 C 240 415 225 390 205 375 C 185 360 175 330 175 295 C 175 220 230 165 300 165 Z M300 248 C 274 248 253 269 253 295 C 253 321 274 342 300 342 C 326 342 347 321 347 295 C 347 269 326 248 300 248 Z" fill="url(#glaze)"/>
    <!-- Sprinkles / Meises -->
    <rect x="235" y="210" width="18" height="6" rx="3" fill="#fef08a" transform="rotate(25 235 210)"/>
    <rect x="330" y="195" width="18" height="6" rx="3" fill="#fff" transform="rotate(-35 330 195)"/>
    <rect x="380" y="260" width="18" height="6" rx="3" fill="#fb923c" transform="rotate(15 380 260)"/>
    <rect x="375" y="325" width="18" height="6" rx="3" fill="#fef08a" transform="rotate(-40 375 325)"/>
    <rect x="230" y="340" width="18" height="6" rx="3" fill="#f43f5e" transform="rotate(20 230 340)"/>
    <rect x="195" y="275" width="18" height="6" rx="3" fill="#fff" transform="rotate(-25 195 275)"/>
  </g>
  <text x="300" y="475" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="700" fill="#78350f">Donat Cokelat</text>
  <text x="300" y="510" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#b45309" letter-spacing="3">FLUFFY &amp; SWEET</text>
</svg>

