<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#f5ede4"/>
    </radialGradient>
    <linearGradient id="bun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="choco" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#2c1e16"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350f" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg2)"/>
  <circle cx="300" cy="300" r="210" fill="#fff" opacity="0.6"/>
  <g filter="url(#shadow2)">
    <!-- Golden bun -->
    <rect x="170" y="210" width="260" height="170" rx="60" fill="url(#bun)"/>
    <!-- Bun highlight -->
    <ellipse cx="300" cy="245" rx="100" ry="25" fill="#fef3c7" opacity="0.45"/>
    <!-- Chocolate stripes / filling drizzle -->
    <path d="M210 235 C 225 285 240 335 250 365" stroke="url(#choco)" stroke-width="16" stroke-linecap="round"/>
    <path d="M285 230 C 295 285 305 340 310 370" stroke="url(#choco)" stroke-width="16" stroke-linecap="round"/>
    <path d="M360 235 C 365 285 365 335 360 365" stroke="url(#choco)" stroke-width="16" stroke-linecap="round"/>
  </g>
  <text x="300" y="475" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="700" fill="#78350f">Roti Cokelat</text>
  <text x="300" y="510" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#b45309" letter-spacing="3">MELTED CHOCOLATE</text>
</svg>

